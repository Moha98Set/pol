<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود — داشبورد آربیتراژ</title>
<style>
:root{--bg:#FBFAF6;--surface:#FFFFFF;--sand:#F2EDE1;--text:#22282C;--muted:#55606A;
      --faint:#8B959E;--border:#E4E0D6;--accent:#2E6B55;--bad:#A33A2E;--bad-soft:#FAEDEA;
      color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
      --bg:#1A1917;--surface:#211F1D;--sand:#2A2724;--text:#ECE8E0;--muted:#A9A399;
      --faint:#7E786F;--border:#35322D;--accent:#6FBF9B;--bad:#E08276;--bad-soft:#2E1D1A;
      color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A1917;--surface:#211F1D;--sand:#2A2724;--text:#ECE8E0;
      --muted:#A9A399;--faint:#7E786F;--border:#35322D;--accent:#6FBF9B;--bad:#E08276;
      --bad-soft:#2E1D1A;color-scheme:dark}
@font-face{font-family:"Vazirmatn";font-style:normal;font-weight:400;font-display:swap;
           src:url("/static/fonts/Vazirmatn-400.woff2") format("woff2")}
@font-face{font-family:"Vazirmatn";font-style:normal;font-weight:700;font-display:swap;
           src:url("/static/fonts/Vazirmatn-700.woff2") format("woff2")}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
     background:var(--bg);color:var(--text);
     font-family:"Vazirmatn","Segoe UI",Tahoma,system-ui,sans-serif;padding:20px}
/* No shadow: the card is separated by its rule, like everything else. The
   gradient is the same one the masthead uses, so the first screen already
   says which document this is. */
.box{background:linear-gradient(160deg,var(--surface) 0%,var(--sand) 100%);
     border:1px solid var(--border);border-radius:10px;padding:34px;width:100%;max-width:380px}
h1{font-size:24px;margin:0 0 6px;line-height:1.5}
p.sub{color:var(--muted);font-size:14.5px;margin:0 0 24px;line-height:1.9}
label{display:block;font-size:12.5px;color:var(--faint);margin:15px 0 5px}
input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;
      background:var(--surface);color:var(--text);font:inherit;font-size:15px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{width:100%;margin-top:24px;padding:11px;border:1px solid var(--accent);border-radius:6px;
       background:var(--accent);color:#fff;font:inherit;font-size:15px;cursor:pointer}
button:hover{opacity:.88}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.flash{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);
       padding:11px 14px;border-radius:10px;font-size:14px;margin-bottom:18px}
.note{color:var(--faint);font-size:12.5px;margin-top:22px;line-height:1.85}
</style>
</head>
<body>
<form class="box" method="post">
  <h1>داشبورد آربیتراژ</h1>
  <p class="sub">برای ادامه وارد شوید.</p>

  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}

  <label for="u">نام کاربری</label>
  <input id="u" name="username" autocomplete="username" autofocus required>

  <label for="p">رمز عبور</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>

  <button type="submit">ورود</button>

  <p class="note">این اتصال رمزنگاری‌نشده است. رمز خود را از شبکه‌ی عمومی یا وای‌فای مشترک وارد نکنید.</p>
</form>
<script>
(function(){var s=localStorage.getItem("polly-theme");if(s)document.documentElement.setAttribute("data-theme",s);})();
</script>
</body>
</html>
